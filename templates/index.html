<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hong Kong property indices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" id="lang-en">English</button>
      <button type="button" data-lang="zh-Hant" id="lang-zh">繁體中文</button>
    </div>
  </header>
  <p class="update-note" id="update-note"></p>

  <main>
    <section class="insight" id="insight-section">
      <div class="section-head">
        <h2 id="insight-heading"></h2>
        <p class="muted" id="insight-at"></p>
      </div>
      <p id="insight-text"></p>
    </section>

    <section>
      <h2 id="latest-heading"></h2>
      <div class="cards" id="cards"></div>
    </section>

    <section class="chart-panel">
      <div class="section-head">
        <h2 id="chart-heading"></h2>
        <p class="muted" id="chart-base"></p>
      </div>
      <div class="canvas-wrap">
        <canvas id="chart" height="360"></canvas>
      </div>
    </section>

    <section>
      <h2 id="evidence-heading"></h2>
      <ol class="evidence" id="evidence"></ol>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
